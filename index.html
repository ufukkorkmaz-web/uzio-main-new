<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uzio</title>
<meta name="theme-color" content="#f2f2f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script>try{var t=localStorage.getItem('uzio-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="landing.css">
<link rel="stylesheet" href="uzio-ai.css">
</head>
<body>
<div class="wallpaper" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#" aria-label="Uzio"><span class="brand-mark">U</span><span>Uzio</span></a>
    <div class="actions">
      <div class="pop" id="langPop">
        <button class="round-btn glass lang-btn" id="langBtn" type="button" aria-expanded="false" aria-controls="langMenu"><span id="langCode">EN</span></button>
        <div class="menu glass" id="langMenu" inert>
          <button class="menu-item" type="button" data-lang="en" aria-current="true"><span class="flag">🇬🇧</span><span>English</span><span class="check">✓</span></button>
          <button class="menu-item" type="button" data-lang="tr"><span class="flag">🇹🇷</span><span>Türkçe</span><span class="check">✓</span></button>
          <button class="menu-item" type="button" data-lang="fr"><span class="flag">🇫🇷</span><span>Français</span><span class="check">✓</span></button>
          <button class="menu-item" type="button" data-lang="de"><span class="flag">🇩🇪</span><span>Deutsch</span><span class="check">✓</span></button>
        </div>
      </div>
      <div class="pop" id="morePop">
        <button class="round-btn glass" id="moreBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="moreMenu"><svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
        <div class="menu glass" id="moreMenu" inert>
          <a class="menu-item" href="main-page.html" id="menuEnter">Enter the game</a>
          <button class="menu-item theme-row" type="button" id="themeToggle"><span id="themeLabel">Dark mode</span><span class="switch" aria-hidden="true"><i></i></span></button>
        </div>
      </div>
    </div>
  </header>

  <main class="hero">
    <section class="copy">
      <h1 id="headline">Meet <span class="grad">Uzio.</span><br>Your game master.</h1>
      <p class="lead" id="lead">Play, compete, unlock rewards and let Uzio build challenges that adapt to you.</p>
      <div class="ctas">
        <a class="btn primary" href="main-page.html#home" id="startBtn">Enter the game <span aria-hidden="true">→</span></a>
        <a class="btn secondary" href="main-page.html#play" id="tryBtn">Quick play</a>
      </div>
      <div class="proof" aria-label="Highlights">
        <span id="proof1">⚡ Quick rounds</span><span class="dot"></span><span id="proof2">🎯 Adaptive challenges</span><span class="dot"></span><span id="proof3">🏆 XP &amp; rewards</span>
      </div>
    </section>

    <section class="visual" aria-label="Uzio character">
      <div class="halo"></div>
      <div class="bubble glass b1"><b>Play</b><span id="bubble1">2–5 min</span></div>
      <div class="bubble glass b2"><b>Perks</b><span id="bubble2">Beat your best</span></div>
      <div class="bubble glass b3"><b>+35 XP</b><span id="bubble3">Protect your streak</span></div>
      <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div>
      <a class="uzio-orb" href="main-page.html#uzio-ai" aria-label="Open Uzio AI">
        <span class="orb-body" id="orbBody">
          <canvas id="uzioOrb" width="512" height="512" aria-hidden="true"></canvas>
          <span class="orb-fx" aria-hidden="true"><span class="hat" id="orbHat"></span></span>
        </span>
      </a>
    </section>
  </main>
</div>
<script src="landing.js"></script>
<script src="uzio-ai.js"></script>
</body>
</html>
